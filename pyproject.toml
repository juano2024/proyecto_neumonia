[project]
name = "proyecto-neumonia"
version = "0.1.0"
description = "Herramienta de apoyo diagnostico de neumonia con Grad-CAM"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "tensorflow>=2.16,<2.19 ; python_full_version < '3.13'",
    "tensorflow>=2.20,<2.22 ; python_full_version >= '3.13'",
    "tensorflow-intel>=2.16,<2.19 ; sys_platform == 'win32' and python_full_version < '3.13'",
    "numpy>=1.26,<2.0 ; python_full_version < '3.13'",
    "numpy>=2.1,<3.0 ; python_full_version >= '3.13'",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "pydicom>=2.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tkcap>=0.0.4",
    "img2pdf>=0.5",
    "pyautogui>=0.9.54",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
override-dependencies = [
    "tensorflow-io-gcs-filesystem==0.31.0 ; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = [
    "ignore::DeprecationWarning:tkcap",
]